version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Application Service: Express API Server
  # ---------------------------------------------------------------------------
  app:
    container_name: flyrank_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=flyrank_db
      # FIX: read JWT_SECRET from your shell or .env (Compose substitutes ${...} from .env); falls back to a DEV-ONLY value so a clean clone still boots
      - JWT_SECRET=${JWT_SECRET:-dev_only_change_me}
      # Stage 5: development-only test switches (headers such as X-Test-Geo-Down). Set TEST_CONTROLS=false in any real deployment
      - TEST_CONTROLS=${TEST_CONTROLS:-true}
      # Stage 5: "mock" = built-in fake geo providers (offline and repeatable); set GEO_MODE=real to call ip-api.com and ipapi.co
      - GEO_MODE=${GEO_MODE:-mock}
    # -------------------------------------------------------------------------
    # Development Hot-Reloading via Bind Mounts
    # Maps local directory to /app inside container while preserving node_modules
    # -------------------------------------------------------------------------
    volumes:
      - .:/app
      - /app/node_modules
    # FIX: the real entrypoint of this project is server.js (src/index.js does not exist)
    command: npx nodemon server.js
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Database Service: PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    container_name: flyrank_postgres
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flyrank_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # FIX (ROOT CAUSE): mount schema.sql into the image's init folder.
      # On the FIRST boot of an empty data volume, Postgres runs every *.sql file in
      # /docker-entrypoint-initdb.d/ against POSTGRES_DB (flyrank_db) automatically.
      # Without this line the database was created empty -> 'relation "widgets" does not exist'.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flyrank_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Customer test site (Stage 7): a plain HTML page served from a DIFFERENT origin (http://localhost:5500)
  # than the API (http://localhost:3000). It plays the part of "a customer's website" that embeds the widget.
  # ---------------------------------------------------------------------------
  customer_site:
    container_name: flyrank_customer_site
    # nginx is a tiny static file server; the page needs no build step
    image: nginx:alpine
    ports:
      # Host port 5500 -> nginx port 80 inside the container
      - "5500:80"
    volumes:
      # Serve the ./customer-site folder read-only
      - ./customer-site:/usr/share/nginx/html:ro

volumes:
  pgdata:
    driver: local
